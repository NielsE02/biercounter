<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f3eb">
  <meta name="description" content="Volledige geschiedenis van de Biercounter.">
  <title>Volledige historie · Wat een hork</title>
  <link rel="stylesheet" href="styles.css?v=8">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">Biercounter</p>
      <h1>Volledige historie</h1>
    </div>
    <div class="topbar-actions">
      <a class="button button-quiet" href="index.html">Terug</a>
    </div>
  </header>

  <main class="page-shell">
    <section id="history-loading" class="panel">
      <div class="loader" aria-hidden="true"></div>
      <p>Historie laden</p>
    </section>

    <section id="history-error" class="panel hidden">
      <p class="eyebrow">Verbinding</p>
      <h2>Kan historie niet laden</h2>
      <p id="history-error-message" class="muted"></p>
      <button id="history-retry" class="button button-primary" type="button">
        Opnieuw proberen
      </button>
    </section>

    <section id="history-screen" class="hidden">
      <section class="panel">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Filter</p>
            <h2>Zoeken in historie</h2>
          </div>
        </div>

        <div class="history-filters">
          <label>
            Speler
            <select id="history-player-filter">
              <option value="">Alle spelers</option>
            </select>
          </label>

          <label>
            Drankje
            <select id="history-drink-filter">
              <option value="">Alle drankjes</option>
              <option value="bier">Bier</option>
              <option value="wijn">Wijn</option>
              <option value="cocktail">Cocktail</option>
            </select>
          </label>

          <label>
            Volgorde
            <select id="history-order-filter">
              <option value="desc">Nieuwste eerst</option>
              <option value="asc">Oudste eerst</option>
            </select>
          </label>
        </div>
      </section>

      <section class="panel">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Alles</p>
            <h2>Geschiedenis</h2>
          </div>
          <span id="history-count" class="muted"></span>
        </div>

        <div id="full-history-list" class="history-list"></div>
        <p id="full-history-empty" class="empty-state hidden">
          Geen invoer gevonden.
        </p>

        <button id="load-more-history" class="button button-quiet load-more-button hidden" type="button">
          Laad 100 meer
        </button>
      </section>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="history.js?v=8"></script>
</body>
</html>
